[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-pv-forecasting"
version = "0.1.0"
description = "Reproducible hourly PV forecasting for a UK site: baselines, XGBoost, BiLSTM, TCN (foundation models next)."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
models = ["torch>=2.1", "xgboost>=2.0"]
data = ["huggingface_hub>=0.23", "xarray>=2024.1", "cfgrib>=0.9.10", "eccodes>=1.7"]
dev = ["pytest>=8", "ruff>=0.4", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pinned so a newer ruff cannot add rules and break CI
select = ["E4", "E7", "E9", "F"]
